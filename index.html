<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Planner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header>
      <h1>📚 School Planner</h1>
      <p class="subtitle">Plan your classes, homework & week</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="schedule">Schedule</button>
      <button class="tab" data-tab="homework">Homework</button>
      <button class="tab" data-tab="subjects">Subjects</button>
    </nav>

    <!-- Schedule Tab -->
    <section id="schedule" class="tab-content active">
      <div class="section-header">
        <h2>Weekly Schedule</h2>
        <button class="btn primary" id="add-class-btn">+ Add Class</button>
      </div>
      <div id="schedule-list" class="card-list"></div>
    </section>

    <!-- Homework Tab -->
    <section id="homework" class="tab-content">
      <div class="section-header">
        <h2>Homework & Tasks</h2>
        <button class="btn primary" id="add-homework-btn">+ Add Homework</button>
      </div>
      <div id="homework-list" class="card-list"></div>
    </section>

    <!-- Subjects Tab -->
    <section id="subjects" class="tab-content">
      <div class="section-header">
        <h2>My Subjects</h2>
        <button class="btn primary" id="add-subject-btn">+ Add Subject</button>
      </div>
      <div id="subjects-list" class="card-list"></div>
    </section>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Add Item</h3>
      <form id="modal-form">
        <div class="form-group">
          <label for="item-title">Title</label>
          <input type="text" id="item-title" required placeholder="e.g. Math Class">
        </div>
        <div class="form-group" id="day-group">
          <label for="item-day">Day</label>
          <select id="item-day">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
        <div class="form-group" id="time-group">
          <label for="item-time">Time</label>
          <input type="text" id="item-time" placeholder="e.g. 9:00 - 10:00">
        </div>
        <div class="form-group" id="due-group">
          <label for="item-due">Due Date</label>
          <input type="date" id="item-due">
        </div>
        <div class="form-group" id="subject-group">
          <label for="item-subject">Subject</label>
          <input type="text" id="item-subject" placeholder="e.g. Math">
        </div>
        <div class="form-group">
          <label for="item-notes">Notes</label>
          <textarea id="item-notes" rows="3" placeholder="Optional notes..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
